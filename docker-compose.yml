services:
  postgres:
    image: postgres:16
    container_name: englishpath-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: englishpath
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - englishpath_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: englishpath-redis
    ports:
      - "6379:6379"

volumes:
  englishpath_pg:
