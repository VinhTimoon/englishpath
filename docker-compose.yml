services:
  postgres:
    image: postgres:16
    container_name: englishpath-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: englishpath
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - englishpath_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d englishpath"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    container_name: englishpath-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: englishpath-api
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/englishpath
      REDIS_URL: redis://redis:6379
      PORT: "3005"
      WEB_ORIGIN: http://localhost:4173
      AUTH_MODE: local
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/api/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:4173
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3005/api/v1
        NEXT_PUBLIC_AUTH_MODE: local
    container_name: englishpath-web
    ports:
      - "4173:4173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  englishpath_pg:
